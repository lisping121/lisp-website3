<script>
(()=>{const key='lispBonusState';const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};const state=read();const day=new Date().toDateString();const paint=()=>{const s=read();document.querySelector('#demoPoints').textContent=(s.points||0)+' points';document.querySelector('#checkinStatus').textContent=s.day===day?'Already checked in today ✓':'Today’s check-in is ready.';document.querySelector('#dailyCheckin').disabled=s.day===day;document.querySelector('#dailyCheckin').style.opacity=s.day===day?'.6':'1';};document.querySelector('#dailyCheckin').addEventListener('click',()=>{const s=read();if(s.day===day){toast('You already checked in today.');return;}s.day=day;s.points=(s.points||0)+100;localStorage.setItem(key,JSON.stringify(s));paint();toast('Demo check-in complete: +100 points!');});document.querySelector('#resetDemo').addEventListener('click',()=>{localStorage.removeItem(key);paint();toast('Demo points reset.');});paint();})();
